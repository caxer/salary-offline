<!doctype html>
<html lang="zh-TW"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#101419">
    <title>薪資看板</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="薪資看板">

    <!-- 第三方腳本：鎖定版本 + SRI（integrity）雜湊，CDN 檔案被竄改時瀏覽器會拒絕執行，
         避免網址金鑰與薪資被竊取。升級版本時要一併更新 integrity。 -->
    <!-- React -->
    <script src="vendor/react.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
    <script src="vendor/react-dom.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>

    <!-- Chart.js (CDN) -->
    <script src="vendor/chart.js" integrity="sha384-dug+JxfBvklEQdJ4AYuBBAIScUz0bVN73xpy273gcAwHjb3qI0fXmuYNaNfdyYJG" crossorigin="anonymous"></script>

    <!-- Shared base styles + components (classic script, works over file://) -->
    <link rel="stylesheet" href="dashboard-common.css?v=20261013-mobile3">
    <script src="dashboard-common.js?v=20261014-link1"></script>
    <script src="link-key.js?v=20261014-link1"></script>
    <script src="open-guide.js?v=20261021-guide1"></script>
    <script src="salary-store.js?v=20261014-link1"></script>
    <script src="salary-offline.js"></script>
    <script src="salary-mobile.js?v=20261014-link1"></script>

    <!-- Use device fonts so the phone UI does not wait for external services. -->
    <style>
      /* Tabs / table base / focus / tooltip / status / scrollbars / chart-container
         / segmented / KPI / delta / empty state → dashboard-common.css.
         NOTE: YearTable sets exact sticky offsets inline (60/130/70px). */

      /* Edit inputs: neutral border, accent only on hover/focus */
      .editable-input,
      .edit-input {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid var(--border-default);
        color: var(--text-primary);
        padding: 4px 6px;
        border-radius: 6px;
        font-family: inherit;
        font-size: 0.8rem;
        width: 100%;
        min-width: 40px;
        box-sizing: border-box;
        transition:
          border-color var(--transition-fast),
          box-shadow var(--transition-fast);
      }
      .editable-input {
        min-width: 90px;
        text-align: right;
      }
      .editable-input:hover,
      .edit-input:hover {
        border-color: rgba(41, 151, 255, 0.6);
      }
      .editable-input:focus,
      .edit-input:focus {
        border-color: var(--accent-color);
        box-shadow: 0 0 0 2px rgba(0, 113, 227, 0.3);
        outline: none;
      }
      .edit-input[type="number"] {
        text-align: right;
      }
      .edit-input[type="text"] {
        min-width: 80px;
      }
      .edit-input::-webkit-calendar-picker-indicator {
        filter: invert(1);
        cursor: pointer;
      }
      .editing-row td {
        background: rgba(251, 191, 36, 0.03);
      }
      .table-container.editing,
      .glass-card.editing {
        box-shadow: inset 0 0 0 1px rgba(251, 191, 36, 0.45);
      }

      /* Tab 0: Year Table fills height */
      .full-height-card {
        flex: 1;
        min-height: 0;
        margin-bottom: 0;
      }

      /* Tab 1: Analysis layout (chart 3 : history 2, wraps on narrow) */
      .analysis-container {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        min-height: 0;
        min-width: 0; /* 否則會被表格 min-content 撐寬，手機上超出畫面 */
      }
      .analysis-container > .glass-card {
        min-width: 0;
      }

      /* Compact main salary table */
      .year-table-section .table-container {
        padding: 0 !important;
        overflow-x: auto;
      }
      .year-table-section table {
        font-size: 0.8rem !important;
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
      }
      .year-table-section th {
        padding: 10px 8px !important;
        line-height: 1.3;
        white-space: nowrap;
        background-color: var(--tbl-head);
        position: sticky;
        top: 0;
        z-index: 20;
        font-size: 0.75rem;
        letter-spacing: 0.5px;
      }
      .year-table-section td {
        padding: 10px 8px !important;
        line-height: 1.3;
        white-space: nowrap;
        transition: background var(--transition-fast);
      }
      .year-table-section tbody tr:hover td {
        background: rgba(255, 255, 255, 0.03);
      }
      .year-table-section tfoot td {
        font-weight: 700;
        background: var(--tbl-group);
        border-top: 1px solid var(--border-default);
      }
      .raise-mark {
        color: var(--success-color);
        font-size: 0.6rem;
        margin-right: 3px;
        vertical-align: 1px;
      }
      .th-current {
        color: var(--accent-secondary) !important;
      }

      /* Year accordion (二代健保 / 福利明細) */
      .acc {
        padding: 0 !important;
        margin-bottom: 12px;
        overflow: hidden;
      }
      .acc-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px 16px;
        flex-wrap: wrap;
        padding: 14px 16px;
        cursor: pointer;
        transition: background var(--transition-fast);
      }
      .acc-head:hover {
        background: var(--bg-hover);
      }
      .acc-head:focus-visible {
        outline: 2px solid var(--accent-color);
        outline-offset: -2px;
      }
      .acc-title {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .acc-title h3 {
        margin: 0 !important;
        font-size: 1rem !important;
      }
      .acc-title .roc {
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--text-muted);
        margin-left: 6px;
      }
      .acc-chevron {
        display: inline-block;
        width: 12px;
        font-size: 0.7rem;
        color: var(--text-secondary);
        transition: transform var(--transition-fast);
      }
      .acc.open .acc-chevron {
        transform: rotate(90deg);
      }
      .acc-stats {
        display: flex;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
      }
      .acc-stat {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        line-height: 1.25;
      }
      .acc-stat span {
        font-size: 0.68rem;
        color: var(--text-muted);
      }
      .acc-stat strong {
        font-family: "Inter", "Noto Sans TC", sans-serif;
        font-size: 0.92rem;
        font-weight: 600;
      }
      .acc-count {
        font-size: 0.75rem;
        color: var(--text-muted);
        white-space: nowrap;
      }
      .acc-body {
        padding: 0 16px 16px;
        border-top: 1px solid var(--border-subtle);
      }
      .acc-body table {
        margin-top: 10px;
      }
      .acc-body tfoot td,
      .tax-table tfoot td {
        font-weight: 700;
        background: var(--tbl-group);
      }
      .text-left {
        text-align: left !important;
      }

      /* Checkbox styling (scoped) */
      .nhi-dashboard input[type="checkbox"],
      .year-table-section input[type="checkbox"],
      .glass-card input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: var(--accent-color);
        cursor: pointer;
      }

      /* Hide number input spinners */
      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
      }

      /* Salary responsive (matches shared breakpoints) */
      @media (max-width: 900px) {
        .analysis-container {
          flex-direction: column;
          /* column + wrap 會讓每行寬度以內容計，卡片被撐出畫面 */
          flex-wrap: nowrap;
        }
      }
      @media all {
        .acc-stats {
          width: 100%;
          gap: 14px;
        }
        .acc-stat {
          align-items: flex-start;
        }

        /* ---- 手機版面：外殼 / 標頭 ---- */
        .app-container {
          padding: 10px;
        }
        .dash-header {
          gap: 8px;
          margin-bottom: 12px;
        }
        .header-actions {
          gap: 6px;
        }
        .header-actions .btn {
          min-height: 38px;
          padding: 8px 12px;
        }
        .glass-card {
          padding: 14px;
        }
        .acc-body {
          padding: 0 12px 12px;
        }
        .segmented.seg-sm .seg-btn {
          padding: 6px 10px;
        }

        /* ---- 年薪紀錄：年份卡 ---- */
        .year-cards {
          display: flex;
          flex-direction: column;
          gap: 12px;
        }
        .year-card-head {
          display: flex;
          align-items: center;
          flex-wrap: wrap;
          gap: 8px;
          margin-bottom: 10px;
        }
        .year-card-title {
          display: flex;
          align-items: baseline;
          gap: 8px;
          font-size: 1.1rem;
        }
        .year-card-total {
          display: flex;
          align-items: center;
          gap: 8px;
          margin-left: auto;
          font-size: 1.05rem;
        }
        .year-card-total .th-sub {
          display: inline;
          margin-left: 6px;
        }
        .month-grid {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 6px;
        }
        .month-cell {
          display: flex;
          flex-direction: column;
          gap: 3px;
          padding: 7px 8px;
          border-radius: 8px;
          min-height: 56px;
          min-width: 0;
        }
        .month-cell-label {
          font-size: 0.68rem;
          color: var(--text-muted);
        }
        .month-cell-value {
          font-size: 0.85rem;
          font-weight: 600;
          white-space: nowrap;
        }
        .month-empty {
          color: var(--text-muted);
          font-weight: 400;
        }
        .month-cell .edit-input {
          width: 100%;
          min-height: 34px;
          font-size: 0.95rem;
        }
        .extra-list {
          margin-top: 10px;
          border-top: 1px solid var(--border-subtle);
        }
        .extra-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 10px;
          padding: 7px 0;
          border-bottom: 1px solid var(--border-subtle);
          font-size: 0.85rem;
        }
        .extra-row:last-child {
          border-bottom: none;
        }
        .extra-row .editable-input {
          width: 130px;
          min-height: 36px;
          font-size: 0.95rem;
        }
        .year-total-card {
          padding: 12px 14px;
        }
        .year-total-card .year-card-head {
          margin-bottom: 0;
        }

        /* ---- 記錄卡（二代健保 / 福利 / 所得紀錄） ---- */
        .rec-list {
          display: flex;
          flex-direction: column;
          gap: 10px;
          padding: 10px 0 2px;
        }
        .rec-card {
          background: var(--tbl-row);
          border: 1px solid var(--border-subtle);
          border-radius: 10px;
          padding: 10px 12px;
        }
        .rec-card-head {
          display: flex;
          align-items: center;
          flex-wrap: wrap;
          gap: 8px;
          margin-bottom: 6px;
          font-size: 0.9rem;
        }
        .rec-card-head > span:first-child {
          font-weight: 600;
        }
        .rec-card-head .delta,
        .rec-card-head .btn {
          margin-left: auto;
        }
        .rec-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 2px 12px;
        }
        .rec-grid > div {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 8px;
          padding: 5px 0;
          font-size: 0.82rem;
          min-width: 0;
        }
        .rec-grid > div > span {
          color: var(--text-muted);
        }
        .rec-grid > div > b {
          font-variant-numeric: tabular-nums;
        }
        .rec-grid .rec-wide {
          grid-column: 1 / -1;
        }
        .rec-grid input[type="checkbox"] {
          width: 22px;
          height: 22px;
        }
        .rec-grid.rec-edit label {
          display: flex;
          flex-direction: column;
          gap: 4px;
          padding: 5px 0;
          font-size: 0.72rem;
          color: var(--text-muted);
        }
        .rec-grid.rec-edit label.rec-wide {
          grid-column: 1 / -1;
        }
        .rec-grid.rec-edit .edit-input {
          width: 100%;
          min-height: 40px;
          font-size: 1rem;
        }
        .rec-grid.rec-edit label.rec-check {
          flex-direction: row;
          align-items: center;
          justify-content: space-between;
        }
        .rec-grid.rec-edit input[type="checkbox"] {
          width: 24px;
          height: 24px;
        }
        .rec-line {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 10px;
          padding: 6px 0;
          border-top: 1px solid var(--border-subtle);
          font-size: 0.85rem;
        }
        .rec-line > span {
          color: var(--text-muted);
        }
        .rec-line > b {
          display: inline-flex;
          align-items: center;
          gap: 8px;
        }
        .rec-line .edit-input {
          width: 55%;
          min-height: 40px;
          font-size: 1rem;
        }
        .rec-total-card {
          background: var(--tbl-group);
        }
      }
    </style>
    <link rel="stylesheet" href="salary-mobile.css?v=20261014-link1">
  </head>
  <body>
    <div id="root"></div>
    <script src="salary-app.js"></script>
    <!-- 找不到 dashboard-common.js（HTML 被移到別的資料夾）時改顯示提示，而不是一片白。 -->
    <script>
      if (!window.formatMoney) {
        document.body.insertAdjacentHTML(
          "afterbegin",
          '<p style="margin:40px auto;max-width:560px;padding:16px 20px;border:1px solid #f59e0b;border-radius:8px;background:#fffbeb;color:#92400e;font:15px/1.6 sans-serif">' +
            "載入失敗：找不到 dashboard-common.js。<br>這個 HTML 必須和 dashboard-common.js、dashboard-common.css 放在同一個資料夾，請把它移回原資料夾再開啟。</p>",
        );
      }
    </script></body></html>
